<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test</title></head>
<body style="background:#0d1017;color:#e6edf3;font-family:sans-serif;padding:20px">
<h2>Data Loading Test</h2>
<div id="log">Loading...</div>
<script>
(async () => {
  const log = document.getElementById('log');
  try {
    log.textContent = 'Fetching questions.json...';
    const res = await fetch('./data/questions.json');
    log.textContent += '\nHTTP ' + res.status;
    const data = await res.json();
    log.textContent += '\nLoaded: ' + data.length + ' questions';
    log.textContent += '\nFirst: ' + JSON.stringify(data[0]).substring(0, 200);

    const subjects = [...new Set(data.map(q => q.subject))];
    log.textContent += '\nSubjects: ' + subjects.join(', ');

    // Test IndexedDB
    log.textContent += '\n\nTesting IndexedDB...';
    const dbReq = indexedDB.open('ee-study-db', 2);
    dbReq.onsuccess = () => { log.textContent += '\nIndexedDB OK'; };
    dbReq.onerror = (e) => { log.textContent += '\nIndexedDB ERROR: ' + e.target.error; };
    dbReq.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('annotations')) db.createObjectStore('annotations', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('progress')) {
        const s = db.createObjectStore('progress', { keyPath: 'id' });
        s.createIndex('by_wrong', 'wrongCount', { unique: false });
      }
      if (!db.objectStoreNames.contains('questions_cache')) db.createObjectStore('questions_cache', { keyPath: 'key' });
      log.textContent += '\nIndexedDB upgraded';
    };

    log.textContent += '\n\nALL OK!';
  } catch(e) {
    log.textContent += '\nERROR: ' + e.message + '\n' + e.stack;
  }
})();
</script>
</body></html>
