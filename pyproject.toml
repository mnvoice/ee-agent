[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ee-agent"
version = "0.1.0"
description = "Korean Electrical Engineer Exam Knowledge Graph with 4-Agent Harness"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/ee_agent --cov-report=term-missing"
markers = [
    "integration: marks tests that require a running Neo4j instance (deselect with '-m not integration')",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py310"]
