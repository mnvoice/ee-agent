concept: superposition theorem
static_boundary: 회로이론에서 선형 회로의 응답을 각 독립전원별 응답의 합으로 구하는 방법
formula_core:
  - response_total = response_from_source1 + response_from_source2 + ...
  - independent voltage source off = short circuit
  - independent current source off = open circuit
dynamic_destinations:
  - multi-source circuit analysis
  - small signal decomposition
  - noise contribution analysis
word_roles:
  linearity: 응답을 더해도 되는 성질
  source_off: 전원을 0으로 두는 처리
  contribution: 특정 전원이 만든 응답 몫
  dependent_source: 회로 안 관계식으로 남겨야 하는 전원
trigger_words:
  - 중첩
  - 독립전원
  - 전원 하나씩
  - 선형회로
  - 응답의 합
memory_logic: 중첩은 전원을 하나씩 켜서 각자의 몫을 구한 뒤 선형성 때문에 다시 더하는 방법이다.
risk: 전력은 전압·전류처럼 단순 중첩되지 않으며 종속전원은 꺼버리면 안 된다.
extension_risk:
  level: LOW
  condition: 선형 회로의 전압·전류 응답 계산에서는 안전함
  caution: 비선형 소자나 전력 계산에는 직접 적용하면 안 됨
