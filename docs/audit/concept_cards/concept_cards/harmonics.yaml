concept: harmonics
static_boundary: 회로이론과 전력공학에서 주기 비정현파를 기본 주파수의 정수배 성분으로 해석하는 관점
formula_core:
  - f_n = n f_1
  - THD = sqrt(sum Vn^2 for n>=2) / V1
dynamic_destinations:
  - power quality
  - filter design
  - transformer and motor heating
word_roles:
  fundamental: 기준이 되는 1차 주파수
  harmonic_order: 기본파의 몇 배인지 나타내는 차수
  distortion: 파형이 정현파에서 벗어난 정도
  THD: 전체 고조파 왜곡의 크기 지표
trigger_words:
  - 고조파
  - 왜형률
  - THD
  - 비정현파
  - 필터
memory_logic: 고조파는 파형이 찌그러졌을 때 그 찌그러짐을 주파수별 정수배 성분으로 나눈 이름표다.
risk: 모든 고조파가 같은 영향을 주는 것은 아니며 차수, 부하 종류, 계통 임피던스, 공진 조건에 따라 위험이 달라진다.
extension_risk:
  level: MEDIUM
  condition: 전력품질과 주기 비정현파 분석에서는 안전함
  caution: 랜덤 노이즈나 비주기 과도현상을 단순 고조파 문제로만 취급하면 안 됨
