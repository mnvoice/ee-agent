concept: two-port network
static_boundary: 회로이론에서 입력 포트와 출력 포트를 가진 선형 회로망을 선택한 convention의 파라미터로 표현하는 방법
formula_core:
  - V1 = A V2 - B I2
  - I1 = C V2 - D I2
  - "[V1 I1] = ABCD matrix * [V2 -I2] depending on convention"
dynamic_destinations:
  - amplifier modeling
  - transmission line sections
  - cascaded network analysis
word_roles:
  port: 전압과 전류를 한 쌍으로 보는 단자쌍
  parameter: 회로 내부를 요약하는 계수
  cascade: 여러 2포트를 차례로 연결하는 구조
  input_output_relation: 입력과 출력 사이의 관계식
trigger_words:
  - 2포트
  - ABCD
  - h파라미터
  - z파라미터
  - cascade
memory_logic: 2포트는 회로 내부를 다 보지 않고도 입력과 출력의 관계를 행렬 언어로 다루게 해준다.
risk: z, y, h, ABCD 파라미터마다 전류 방향과 부호 convention이 달라서 공식을 그대로 섞으면 안 된다.
extension_risk:
  level: MEDIUM
  condition: 선형 소신호 회로와 convention이 명시된 cascade 모델에서는 안전함
  caution: 비선형 증폭기나 큰 신호 동작은 동작점별 소신호 모델로 제한해야 함
