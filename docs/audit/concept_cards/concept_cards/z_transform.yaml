concept: z-transform
static_boundary: 회로이론 core보다는 broad exam-scope에서 등장하며, 이산시간 신호를 z-domain으로 옮기는 변환
formula_core:
  - X(z) = sum x[n] z^(-n)
  - z = e^(sT)
  - unit delay = z^(-1)
dynamic_destinations:
  - digital control
  - discrete signal processing
  - sampled-data systems
word_roles:
  sampling: 연속 신호를 일정 간격으로 보는 것
  delay: 한 샘플 늦어지는 동작
  unit_circle: 이산 시스템의 안정 경계
  discrete_pole: 샘플마다 줄거나 커지는 비율
trigger_words:
  - z변환
  - 샘플링
  - 단위지연
  - 단위원
  - 이산시스템
memory_logic: z-transform은 라플라스가 이산시간 세계로 넘어간 것이고, 안정의 경계가 좌반평면에서 단위원 내부로 바뀐다.
risk: 회로이론 local PRIMARY corpus gap이 있으므로 core 회로이론 card처럼 취급하면 안 된다.
extension_risk:
  level: MEDIUM
  condition: 표준 디지털 제어, DSP, sampled-data system 문맥에서는 안전함
  caution: 회로이론 core grounding이 아니라 broad-scope 확장이므로 corpus-gap 표시와 별도 review가 필요함
