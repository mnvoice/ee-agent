concept: mutual inductance
static_boundary: 회로이론에서 선형 결합 코일에서 한 코일의 전류 변화가 다른 코일에 전압을 유도하는 관계
formula_core:
  - v2 = M di1/dt
  - M = k sqrt(L1 L2)
  - 0 <= k <= 1
dynamic_destinations:
  - transformer modeling
  - coupled inductors
  - electromagnetic interference
word_roles:
  coupling: 한 회로의 자기장이 다른 회로에 연결되는 정도
  dot_convention: 유도전압 극성을 정하는 표시
  leakage: 결합되지 않고 새는 자속
  transformer_action: 자기 결합으로 전압과 전류를 바꾸는 작용
trigger_words:
  - 상호인덕턴스
  - 결합계수
  - 점표시
  - 변압기
  - 유도전압
memory_logic: 상호인덕턴스는 한 코일의 전류 변화가 자기장을 통해 다른 코일의 전압으로 나타나는 연결 강도다.
risk: dot convention을 잘못 해석하면 결합항 부호가 반대로 들어가며, 포화나 누설이 크면 단순 M 모델이 부족하다.
extension_risk:
  level: MEDIUM
  condition: 선형 자기 결합과 이상 변압기 근사 문맥에서는 안전함
  caution: 실제 변압기에서는 포화, 누설자속, 철손, 주파수 의존 손실을 별도 모델로 봐야 함
